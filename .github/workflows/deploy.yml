name: Auto Deploy Backend

on:
  push:
    branches: [ "main", "KAGrobot/v2" ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # ⭐ 必須！讓 GitHub 發 OIDC token

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auth Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/322382343314/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push (via Cloud Build)
        run: |
          IMAGE_URL="asia-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/kagrobot:${{ github.sha }}"
          
          gcloud builds submit \
            --tag $IMAGE_URL \
            ./backend

      - name: Deploy to Cloud Run
        run: |
          IMAGE_URL="asia-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/kagrobot:${{ github.sha }}"
          
          gcloud run deploy kagrobot \
            --image $IMAGE_URL \
            --region asia-east1 \
            --platform managed \
            --memory 4Gi \
            --timeout 600 \
            --allow-unauthenticated