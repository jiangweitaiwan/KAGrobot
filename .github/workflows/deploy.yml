name: Auto Deploy Backend

on:
  push:
    branches: [ "main" ] # 只有 push 到 main 分支時才執行
    paths:
      - 'backend/**'    # 只有當 backend 資料夾有變動時才觸發，省資源！

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auth Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Build and Push
        run: |
          IMAGE_URL="asia-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/kagrobot:${{ github.sha }}"
          docker build -t $IMAGE_URL -f backend/Dockerfile ./backend
          docker push $IMAGE_URL

      - name: Deploy to Cloud Run
        run: |
          IMAGE_URL="asia-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/kagrobot:${{ github.sha }}"
          gcloud run deploy kagrobot \
            --image $IMAGE_URL \
            --region asia-east1 \
            --platform managed